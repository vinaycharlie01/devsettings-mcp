version: '3'

vars:
  BINARY_NAME: devsettings-mcp
  BUILD_DIR: ./build
  MAIN_PKG: ./cmd/server

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  init:
    desc: Initialize development dependencies
    cmds:
      - go mod download
      - go mod verify

  deps:
    desc: Download and verify Go dependencies
    cmds:
      - go mod tidy
      - go mod verify

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w -s .

  fmt:check:
    desc: Check formatting without modifying files
    cmds:
      - test -z "$(gofmt -l .)"

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run Go linting
    cmds:
      - go vet ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./... -v -race

  test:short:
    desc: Run unit tests (short mode)
    cmds:
      - go test ./... -short

  test:coverage:
    desc: Generate test coverage report
    cmds:
      - go test ./... -coverprofile=coverage.out -covermode=atomic
      - go tool cover -func=coverage.out

  build:
    desc: Build the MCP server binary
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.MAIN_PKG}}

  run:
    desc: Run the MCP server locally (stdio mode)
    deps: [build]
    cmds:
      - '{{.BUILD_DIR}}/{{.BINARY_NAME}}'

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -f coverage.out

  ci:
    desc: Run all CI checks
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test
      - task: build
